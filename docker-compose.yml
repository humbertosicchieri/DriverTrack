services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:5000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/database.sqlite
    volumes:
      - db-data:/data
    restart: unless-stopped

volumes:
  db-data:
    name: drivertrack_db-data
